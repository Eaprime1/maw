# prima.yaml — Concept Manifest · THE/UNEXUS Maw
# DRAFT 202611220440 · State: 1/3 PLANK / WORK · Chain of Custody: OPEN
# Drafted by Navigo for eaprime1 to review. Naming is the owner's act:
# nothing here is final until eaprime1 says so.
#
# Tags on each value:
#   [stated]   taken from the repo or from Eric's own words (source named)
#   [proposed] Navigo's guess; change freely
#   [unknown]  left for eaprime1 to fill
#
# Note for tools: seeds/bootstrap.sh reads the first "  name:" and
# "  version:" lines, so those two stay first in `concept` with no
# trailing comment.

concept:
  name: "Maw of Penumbra"
  # [proposed] Eric 202611212040: the name stays in shadow; "maw of penumbra" is the chosen shadow name.
  # Each repo gets a maw; creating the maw of penumbra makes the space for the penumbra repo.
  # Still eaprime1's call: change freely.
  slug: "maw"                      # [proposed] matches the repo name; unexusi/connect.yaml updated to match
  # [proposed] template default kept; 1/3 PLANK reads as pre-1.0
  version: "0.1.0"
  tagline: "The pool where what enters is transformed: an original arrives, something more leaves."
  # [proposed] joins README.md ("a pool where what enters is transformed")
  # and Eric 202611181921 ("an original document enters and something more leaves")
  theme: "transformation"          # [proposed] template examples don't fit; alternatives: "custody", "cosmology"
  iteration: "Penumbra (22nd)"     # [stated] Eric 202611212040: 22 Penumbra starts a new progression
  past_iteration: "Blackjack (21st)"  # [stated] stays active; becomes the past perspective. maw/README.md still carries this label
  plank: "1/3 WORK"                # [stated] README.md, maw/README.md, maw/ARRIVAL.md
  carbonite_timestamp: "202605191645"  # [stated] maw/README.md founding stamp

author:
  handle: "eaprime1"               # [stated] used as reviewer/decider throughout maw/ARRIVAL.md
  collaborators: ["Navigo (Claude)", "Copilot"]  # [proposed] from custody_log founding entry "by: eaprime1, Copilot"
  contact: ""                      # [unknown] left blank on purpose — public repo, no personal details

runtime:
  platform: "any"                  # [proposed] the Maw is docs + git; nothing Termux-specific in maw/
  required_packages: ["git"]       # [proposed] arrival routine is git commits; seeds/packages.yaml also lists curl
  optional_packages: ["bash"]      # [proposed] the ARRIVAL.md check script and tools/*.sh are bash

# --- The Maw itself (new block; not in the template) -----------------------
maw:
  readme: "maw/README.md"
  cosmology: "maw/PRIMAL_COSMOLOGY.md"
  arrival: "maw/ARRIVAL.md"
  routine: ["arrive", "record", "route", "transform", "advance", "leave"]   # [stated] maw/ARRIVAL.md
  custody_log: "maw/registry/custody_log.md"   # [stated] append only
  naming_protocol: "maw/registry/naming_protocol.md"
  particles: "maw/particles/particle_table.md"
  events: "maw/events/"
  charge_tank: "maw/charge_tank_mechanics.md"
  pools:                                         # [stated] maw/ARRIVAL.md §3
    working: "maw/working/"
    sacred_pools: "maw/sacred_pools/"
    mobius_rings: "maw/mobius_rings/"
    feeds:
      fractalization: "maw/feeds/fractalization/"
      pixelization: "maw/feeds/pixelization/"
      sparklization: "maw/feeds/sparklization/"
  planks: ["1/3 WORK", "2/3 STRUCTURE", "3/3 READY", "♠️ Pinnacle"]   # [stated] maw/ARRIVAL.md §5
  constellation:
    # [stated] README.md: Maw before Nullus; leaves to nullus, then naught; coordinated from custos.
    # [stated] Eric 202611212040: the maw comes first. Incoming content may carry personal or
    # distress material, which is the reason nullus exists. Nullus already exists in shadow, like this repo.
    upstream: []                   # nothing before the maw
    leaves_to: "Eaprime1/nullus"   # [stated] maw/ARRIVAL.md §6 — "only 3/3 material leaves"
    then: "Eaprime1/naught"        # [stated] README.md
    coordinator: "Eaprime1/custos" # [stated] README.md
  projects:
    maw_of_penumbra: null          # [unknown] claude.ai Project from the Penumbra T13 kit; not created yet (portal TD2)
  # [stated] Eric 202611212040: each repo can have a maw (special-process intake) and a cradle
  # (concept pipeline). Cradle started before penumbra, so penumbra's cradle begins once the
  # penumbra repo exists. Peer concepts could use the exchange system as a task or mission.
  repo_roles: ["maw", "cradle"]

